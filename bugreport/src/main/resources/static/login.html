<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BugReport — Đăng nhập</title>
    <meta name="theme-color" content="#0a0e1a">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-bg {
            position: fixed; inset: 0;
            background-image:
                    linear-gradient(rgba(34,211,238,0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(34,211,238,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPan 20s linear infinite;
        }
        @keyframes gridPan {
            0%   { background-position: 0 0; }
            100% { background-position: 48px 48px; }
        }
        .login-orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; opacity: 0.15;
        }
        .orb-1 { width:400px;height:400px;background:var(--cyan);top:-100px;left:-80px;animation:orbFloat 8s ease-in-out infinite; }
        .orb-2 { width:300px;height:300px;background:var(--violet);bottom:-60px;right:-60px;animation:orbFloat 10s ease-in-out infinite reverse; }
        @keyframes orbFloat {
            0%,100% { transform:translate(0,0); }
            50%      { transform:translate(20px,-20px); }
        }
        .login-page { position:relative;z-index:1; }
        .login-card { animation:slideUpModal 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }

        /* ── Tab switcher ── */
        .auth-tabs {
            display: flex;
            background: var(--bg-3);
            border-radius: var(--r-md);
            padding: 4px;
            margin-bottom: 28px;
            gap: 4px;
        }
        .auth-tab {
            flex: 1;
            padding: 9px 12px;
            border: none;
            border-radius: calc(var(--r-md) - 2px);
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
            display: flex; align-items: center; justify-content: center; gap: 7px;
        }
        .auth-tab.active {
            background: var(--surface-2);
            color: var(--cyan);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .auth-tab:hover:not(.active) { color: var(--text); }

        /* ── Form panel animation ── */
        .auth-panel {
            display: none;
            animation: panelIn 0.28s cubic-bezier(0.2,0.9,0.3,1) both;
        }
        .auth-panel.active { display: block; }
        @keyframes panelIn {
            from { opacity:0; transform:translateY(8px); }
            to   { opacity:1; transform:none; }
        }

        /* ── Role selector ── */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }
        .role-option {
            position: relative;
        }
        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0; height: 0;
        }
        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 12px 8px;
            border: 1.5px solid var(--border);
            border-radius: var(--r-md);
            cursor: pointer;
            transition: all 200ms ease;
            background: var(--bg-3);
            text-align: center;
        }
        .role-label .role-icon {
            font-size: 1.3rem;
            line-height: 1;
        }
        .role-label .role-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            transition: color 200ms;
        }
        .role-label .role-desc {
            font-size: 0.68rem;
            color: var(--text-dim);
            line-height: 1.3;
        }
        .role-option input:checked + .role-label {
            border-color: var(--cyan);
            background: var(--cyan-dim);
            box-shadow: 0 0 0 3px rgba(34,211,238,0.1);
        }
        .role-option input:checked + .role-label .role-name { color: var(--cyan); }
        .role-option input[value="DEVELOPER"]:checked + .role-label {
            border-color: var(--violet);
            background: var(--violet-dim);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.1);
        }
        .role-option input[value="DEVELOPER"]:checked + .role-label .role-name { color: var(--violet); }
        .role-option input[value="ADMIN"]:checked + .role-label {
            border-color: var(--amber, #f59e0b);
            background: rgba(245,158,11,0.1);
            box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
        }
        .role-option input[value="ADMIN"]:checked + .role-label .role-name { color: var(--amber, #f59e0b); }
        .role-label:hover { border-color: var(--border-bright); }

        /* ── Role badge (on login heading) ── */
        .role-badge-hint {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            margin-top: 4px;
        }
        .badge-customer { background: var(--cyan-dim); color: var(--cyan); border: 1px solid rgba(34,211,238,0.25); }
        .badge-developer { background: var(--violet-dim); color: var(--violet); border: 1px solid rgba(167,139,250,0.25); }
        .badge-admin { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }

        /* ── Strength meter ── */
        .strength-bar {
            display: flex; gap: 4px; margin-top: 8px;
        }
        .strength-seg {
            flex: 1; height: 3px; border-radius: 2px;
            background: var(--border);
            transition: background 300ms ease;
        }
        .strength-label {
            font-size: 0.72rem; margin-top: 5px; color: var(--text-dim);
            transition: color 200ms;
        }
        .str-1 .strength-seg:nth-child(1) { background: var(--red); }
        .str-2 .strength-seg:nth-child(-n+2) { background: var(--amber, #f59e0b); }
        .str-3 .strength-seg:nth-child(-n+3) { background: var(--blue); }
        .str-4 .strength-seg { background: var(--green); }

        /* ── Portal links ── */
        .portal-links {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .portal-link {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: var(--bg-3);
            color: var(--text-muted);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 200ms ease;
            font-family: var(--font);
        }
        .portal-link:hover { color: var(--text); border-color: var(--border-bright); }
        .portal-link.dev:hover { color: var(--violet); border-color: var(--violet); background: var(--violet-dim); }
        .portal-link.admin:hover { color: #f59e0b; border-color: #f59e0b; background: rgba(245,158,11,0.1); }
    </style>
</head>
<body>

<div class="login-bg"></div>
<div class="login-orb orb-1"></div>
<div class="login-orb orb-2"></div>

<div class="login-page" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="card login-card" style="max-width:480px;width:100%;padding:36px 40px;">

        <!-- Header -->
        <div class="login-header" style="margin-bottom:24px">
            <div class="login-logo">BR</div>
            <h2 id="auth-heading">Đăng nhập</h2>
            <p id="auth-subheading">Báo cáo lỗi hoặc theo dõi hệ thống của bạn</p>
        </div>

        <!-- Tab switcher -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
            </button>
            <button class="auth-tab" id="tab-register" onclick="switchTab('register')">
                <i class="fa-solid fa-user-plus"></i> Đăng ký
            </button>
        </div>

        <!-- ── Login panel ── -->
        <div class="auth-panel active" id="panel-login">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                        <input class="input" type="text" name="username" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrap" style="position:relative">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input class="input" type="password" name="password" id="login-pwd" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" onclick="togglePwd('login-pwd','eye-login')" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:4px">
                            <i class="fa-solid fa-eye" id="eye-login"></i>
                        </button>
                    </div>
                </div>
                <div class="form-footer" style="margin-top:24px">
                    <button class="btn btn-primary" type="submit" id="loginBtn" style="flex:1;justify-content:center;padding:12px">
                        <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
                    </button>
                </div>
            </form>

            <div id="login-error" style="display:none;margin-top:14px;gap:8px" class="error-state">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="login-error-msg">Sai tên đăng nhập hoặc mật khẩu</span>
            </div>

            <!-- Portal links for other roles -->
            <div class="portal-links">
                <a class="portal-link dev" href="/developer.html" onclick="return requireRole(event,'DEVELOPER')">
                    <i class="fa-solid fa-code"></i> Dev Portal
                </a>
                <a class="portal-link admin" href="/admin-users.html" onclick="return requireRole(event,'ADMIN')">
                    <i class="fa-solid fa-shield-halved"></i> Admin Panel
                </a>
            </div>
        </div>

        <!-- ── Register panel ── -->
        <div class="auth-panel" id="panel-register">
            <form id="registerForm" onsubmit="handleRegister(event)">

                <!-- Role selector -->
                <div class="form-group">
                    <label>Loại tài khoản</label>
                    <div class="role-selector" id="role-selector">
                        <div class="role-option">
                            <input type="radio" name="reg-role" id="role-user" value="USER" checked>
                            <label class="role-label" for="role-user">
                                <span class="role-icon">👤</span>
                                <span class="role-name">Customer</span>
                                <span class="role-desc">Báo cáo & theo dõi lỗi</span>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="reg-role" id="role-dev" value="DEVELOPER">
                            <label class="role-label" for="role-dev">
                                <span class="role-icon">💻</span>
                                <span class="role-name">Developer</span>
                                <span class="role-desc">Xử lý & phân tích lỗi</span>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="reg-role" id="role-admin" value="ADMIN">
                            <label class="role-label" for="role-admin">
                                <span class="role-icon">🛡️</span>
                                <span class="role-name">Admin</span>
                                <span class="role-desc">Quản lý toàn hệ thống</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                        <input class="input" type="text" name="username" placeholder="Nguyễn Văn A" required autocomplete="username" minlength="3">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrap">
                        <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
                        <input class="input" type="email" name="email" placeholder="you@company.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrap" style="position:relative">
                        <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
                        <input class="input" type="password" name="password" id="reg-pwd" placeholder="Tối thiểu 8 ký tự" required minlength="8" oninput="checkStrength(this.value)">
                        <button type="button" onclick="togglePwd('reg-pwd','eye-reg')" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:4px">
                            <i class="fa-solid fa-eye" id="eye-reg"></i>
                        </button>
                    </div>
                    <div class="strength-bar" id="strength-bar">
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                        <div class="strength-seg"></div>
                    </div>
                    <div class="strength-label" id="strength-label"></div>
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <div class="input-wrap" style="position:relative">
                        <span class="input-icon"><i class="fa-solid fa-lock-open"></i></span>
                        <input class="input" type="password" name="confirm" id="reg-confirm" placeholder="Nhập lại mật khẩu" required>
                        <button type="button" onclick="togglePwd('reg-confirm','eye-confirm')" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text-dim);cursor:pointer;padding:4px">
                            <i class="fa-solid fa-eye" id="eye-confirm"></i>
                        </button>
                    </div>
                </div>
                <div class="form-footer" style="margin-top:24px">
                    <button class="btn btn-primary" type="submit" id="registerBtn" style="flex:1;justify-content:center;padding:12px">
                        <i class="fa-solid fa-user-plus"></i> Tạo tài khoản
                    </button>
                </div>
            </form>

            <div id="register-error" style="display:none;margin-top:14px;gap:8px" class="error-state">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="register-error-msg"></span>
            </div>
            <div id="register-success" style="display:none;margin-top:14px;gap:8px;background:var(--green-dim);border:1px solid rgba(74,222,128,0.25);color:var(--green);padding:12px 16px;border-radius:var(--r-md);font-size:0.88rem">
                <i class="fa-solid fa-circle-check"></i>
                <span id="register-success-msg">Đăng ký thành công! Đang chuyển hướng…</span>
            </div>
        </div>

    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
