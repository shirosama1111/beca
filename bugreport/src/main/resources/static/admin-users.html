<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BugReport — User Management</title>
  <meta name="theme-color" content="#0a0e1a">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* User avatar */
    .user-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--grad-brand);
      display: inline-flex; align-items: center; justify-content: center;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .user-cell { display: flex; align-items: center; gap: 10px; }
    .user-cell .user-name { font-weight: 600; font-size: 0.88rem; color: var(--text); }
    .user-cell .user-email { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); }

    /* Role badges */
    .role-badge-admin  { background: var(--violet-dim); color: var(--violet); border: 1px solid rgba(167,139,250,0.25); }
    .role-badge-dev    { background: var(--cyan-dim);   color: var(--cyan);   border: 1px solid rgba(34,211,238,0.25); }
    .role-badge-user   { background: var(--surface-2);  color: var(--text-muted); border: 1px solid var(--border); }

    /* Table wrapper */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
    }
    .table { border-radius: 0; }
    .table th, .table td { white-space: nowrap; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--surface-2);
      border: 1px solid var(--border-bright);
      color: var(--text);
      padding: 12px 20px;
      border-radius: var(--r-md);
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: var(--shadow-float);
      opacity: 0;
      transform: translateY(10px);
      transition: all 250ms ease;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #toast.show { opacity: 1; transform: none; }
    #toast.success { border-color: rgba(74,222,128,0.3); color: var(--green); }
    #toast.error   { border-color: rgba(248,113,113,0.3); color: var(--red); }

    /* Loading skeleton */
    .skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 400%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; }
    @keyframes skeleton-loading { 0% { background-position: 100%; } 100% { background-position: -100%; } }
  </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="topbar">
  <div class="brand">
    <div class="logo">BR</div>
    <span class="brand-name">BugReport</span>
  </div>
  <div class="nav-actions">
    <a href="/index.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    <button class="btn btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</nav>

<div class="container" style="padding-top:28px">

  <div class="admin-topbar fade-in">
    <div>
      <h2>User Management</h2>
      <div class="kv" style="margin-top:2px">Quản lý tài khoản và phân quyền</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="search-wrap" style="min-width:220px">
        <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input class="input" id="user-search" type="text" placeholder="Tìm user…" oninput="filterUsers()">
      </div>
      <button class="btn btn-primary" onclick="loadUsers()">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Stats row -->
  <div class="row mb-16 fade-in" style="margin-bottom:20px">
    <div class="card" style="flex:1;min-width:140px;padding:14px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--violet-dim);display:flex;align-items:center;justify-content:center;color:var(--violet);font-size:1rem"><i class="fa-solid fa-shield"></i></div>
      <div><div class="stat-number" style="font-size:1.5rem;color:var(--violet)" id="count-admin">—</div><div class="stat-label">Admins</div></div>
    </div>
    <div class="card" style="flex:1;min-width:140px;padding:14px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--cyan-dim);display:flex;align-items:center;justify-content:center;color:var(--cyan);font-size:1rem"><i class="fa-solid fa-code"></i></div>
      <div><div class="stat-number" style="font-size:1.5rem;color:var(--cyan)" id="count-dev">—</div><div class="stat-label">Developers</div></div>
    </div>
    <div class="card" style="flex:1;min-width:140px;padding:14px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--blue-dim);display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:1rem"><i class="fa-solid fa-users"></i></div>
      <div><div class="stat-number" style="font-size:1.5rem;color:var(--blue)" id="count-user">—</div><div class="stat-label">Users</div></div>
    </div>
    <div class="card" style="flex:1;min-width:140px;padding:14px 18px;display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:8px;background:var(--green-dim);display:flex;align-items:center;justify-content:center;color:var(--green);font-size:1rem"><i class="fa-solid fa-user-check"></i></div>
      <div><div class="stat-number" style="font-size:1.5rem;color:var(--green)" id="count-total">—</div><div class="stat-label">Total</div></div>
    </div>
  </div>

  <!-- Table card -->
  <div class="card fade-in" style="padding:0;overflow:hidden">
    <div class="table-wrap">
      <table class="table" id="users-table">
        <thead>
          <tr>
            <th>#</th>
            <th>User</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <!-- Loading skeleton rows -->
          <tr><td colspan="5">
            <div style="padding:32px;text-align:center;color:var(--text-dim)">
              <i class="fa-solid fa-spinner fa-spin" style="font-size:1.4rem;margin-bottom:8px;display:block"></i>
              Đang tải dữ liệu…
            </div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Toast notification -->
<div id="toast">
  <i class="fa-solid fa-circle-check" id="toast-icon"></i>
  <span id="toast-msg">Role updated</span>
</div>

<script src="js/admin-users.js"></script>
</body>
</html>
