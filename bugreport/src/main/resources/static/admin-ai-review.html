<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin — AI Pipeline Review</title><link rel="stylesheet" href="css/style.css"><style>main{max-width:1200px;margin:32px auto;padding:16px}.panel,.review{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}.muted{color:var(--text-dim);line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}</style></head>
<body><nav class="topbar"><div class="brand"><div class="logo">BR</div><span class="brand-name">AI Pipeline Review</span></div><div class="nav-actions"><a class="btn btn-ghost" href="/admin-users.html">Admin</a><button class="btn btn-ghost" id="logout">Đăng xuất</button></div></nav><main>
<section class="panel"><h1>Pipeline phân tích lỗi</h1><p class="muted">Rule-based → ML đã huấn luyện từ train split trên ai-beta → LLM. Admin kiểm tra từng stage, thêm ghi chú và duyệt kết quả. Dataset synthetic, chưa được xác minh bởi con người.</p><div class="grid"><label>Report<select class="input" id="report"><option value="">Đang tải…</option></select></label><button class="btn btn-primary" id="run" disabled>Chạy pipeline</button><button class="btn btn-ghost" id="refresh">Tải lại review</button><label>Lọc trạng thái<select class="input" id="filter"><option value="">Tất cả</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>NEEDS_CHANGES</option></select></label></div><p id="status" class="muted" role="status"></p></section><section class="panel"><h2>Admin review</h2><div id="reviews" class="muted">Đang tải…</div></section>
</main><script src="js/admin-ai-review.js"></script></body></html>
