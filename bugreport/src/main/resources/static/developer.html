<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BugReport — Developer Portal</title>
    <meta name="theme-color" content="#0a0e1a">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ── Developer-specific accent: violet instead of cyan ── */
        :root {
            --dev-accent: var(--violet);
            --dev-accent-dim: var(--violet-dim);
            --dev-glow: 0 0 20px rgba(167,139,250,0.3), 0 0 60px rgba(167,139,250,0.08);
        }

        /* ── Queue board layout ── */
        .queue-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            min-height: calc(100vh - 140px);
        }

        /* ── Sidebar: my assigned reports ── */
        .dev-sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .assigned-item {
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            cursor: pointer;
            transition: all 200ms ease;
            border-left: 3px solid transparent;
        }
        .assigned-item:hover { border-color: var(--dev-accent); background: var(--dev-accent-dim); }
        .assigned-item.active { border-left-color: var(--dev-accent); background: var(--dev-accent-dim); }
        .assigned-item .item-title { font-size: 0.84rem; font-weight: 600; color: var(--text); margin-bottom: 4px; }
        .assigned-item .item-meta { font-size: 0.72rem; color: var(--text-muted); display: flex; gap: 8px; }

        /* ── Main work area ── */
        .work-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Report detail panel (in-page, no modal) ── */
        .detail-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 24px;
            flex: 1;
        }

        .detail-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: var(--text-dim);
            gap: 12px;
        }
        .detail-empty .empty-icon-large { font-size: 3rem; }

        /* ── Action bar ── */
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .btn-dev {
            background: var(--dev-accent-dim);
            color: var(--dev-accent);
            border: 1px solid rgba(167,139,250,0.3);
        }
        .btn-dev:hover { background: rgba(167,139,250,0.25); box-shadow: var(--dev-glow); }

        /* ── Status changer ── */
        .status-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .status-chip {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-3);
            color: var(--text-muted);
            transition: all 180ms ease;
        }
        .status-chip:hover { border-color: var(--border-bright); color: var(--text); }
        .status-chip.chip-active-OPEN        { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.4); color: var(--red); }
        .status-chip.chip-active-IN_PROGRESS { background: rgba(34,211,238,0.12); border-color: rgba(34,211,238,0.4); color: var(--cyan); }
        .status-chip.chip-active-RESOLVED    { background: var(--green-dim); border-color: rgba(74,222,128,0.4); color: var(--green); }
        .status-chip.chip-active-CLOSED      { background: var(--surface-2); border-color: var(--border); color: var(--text-muted); }
        .status-chip.chip-active-WONT_FIX    { background: rgba(107,114,128,0.15); border-color: rgba(107,114,128,0.3); color: #9ca3af; }

        /* ── Dev notes textarea ── */
        .dev-notes-area {
            margin-top: 12px;
        }
        .dev-notes-area textarea {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.85rem;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: all 220ms;
        }
        .dev-notes-area textarea:focus {
            border-color: var(--dev-accent);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.12);
        }

        /* ── Screenshot thumbnail ── */
        .screenshot-thumb {
            max-width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
            cursor: zoom-in;
            transition: transform 200ms;
        }
        .screenshot-thumb:hover { transform: scale(1.01); }

        /* ── Console errors block ── */
        .console-block {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            padding: 12px 14px;
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--red);
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Unassigned queue (right side when no active report) ── */
        .queue-card {
            padding: 14px 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 200ms ease;
        }
        .queue-card:hover { border-color: var(--dev-accent); transform: translateX(4px); }
        .queue-card .qc-priority { width: 4px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
        .qc-CRITICAL { background: var(--red); }
        .qc-HIGH     { background: #fb923c; }
        .qc-MEDIUM   { background: #facc15; }
        .qc-LOW      { background: var(--green); }
        .queue-card .qc-info { flex: 1; min-width: 0; }
        .queue-card .qc-title { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .queue-card .qc-meta { font-size: 0.73rem; color: var(--text-muted); margin-top: 3px; display: flex; gap: 10px; }
        .queue-card .qc-action { flex-shrink: 0; }

        /* ── Stats top bar ── */
        .dev-stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .dev-stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 0.82rem;
            font-weight: 600;
        }
        .dev-stat-pill .pill-num { font-size: 1.1rem; font-weight: 700; }

        /* ── Lightbox ── */
        #img-lightbox {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            display: none;
        }
        #img-lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--r-lg); }
        #img-lightbox .close-lb {
            position: absolute; top: 20px; right: 24px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text); width: 36px; height: 36px;
            border-radius: var(--r-md); font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* ── Toast ── */
        #toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--surface-2); border: 1px solid var(--border-bright);
            color: var(--text); padding: 12px 20px;
            border-radius: var(--r-md); font-size: 0.88rem; font-weight: 500;
            box-shadow: var(--shadow-float);
            opacity: 0; transform: translateY(10px);
            transition: all 250ms ease; z-index: 999;
            display: flex; align-items: center; gap: 8px;
        }
        #toast.show { opacity: 1; transform: none; }
        #toast.success { border-color: rgba(74,222,128,0.3); color: var(--green); }
        #toast.error   { border-color: rgba(248,113,113,0.3); color: var(--red); }
    </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav class="topbar">
    <div class="brand">
        <div class="logo" style="background:var(--grad-brand)">BR</div>
        <span class="brand-name">BugReport</span>
        <span style="font-size:0.72rem;padding:3px 10px;border-radius:12px;background:var(--violet-dim);color:var(--violet);border:1px solid rgba(167,139,250,0.25);font-weight:700;margin-left:4px">DEV</span>
    </div>
    <div class="nav-actions">
        <button class="btn-icon" title="Thông báo" onclick="toggleSSE()"><i class="fa-solid fa-bell" id="bell-icon"></i></button>
        <span id="dev-username" style="font-size:0.85rem;color:var(--text-muted);padding:0 4px"></span>
        <button class="btn btn-ghost" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
</nav>

<div class="container" style="padding-top:24px">

    <!-- Dev stats pills -->
    <div class="dev-stats fade-in">
        <div class="dev-stat-pill">
            <i class="fa-solid fa-inbox" style="color:var(--red)"></i>
            <span class="pill-num" id="ds-open">—</span>
            <span style="color:var(--text-muted)">Mở</span>
        </div>
        <div class="dev-stat-pill">
            <i class="fa-solid fa-gear fa-spin" style="color:var(--cyan);animation-duration:3s"></i>
            <span class="pill-num" id="ds-progress">—</span>
            <span style="color:var(--text-muted)">Đang xử lý</span>
        </div>
        <div class="dev-stat-pill">
            <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
            <span class="pill-num" id="ds-resolved">—</span>
            <span style="color:var(--text-muted)">Đã xử lý</span>
        </div>
        <div class="dev-stat-pill" style="margin-left:auto">
            <i class="fa-solid fa-user-gear" style="color:var(--violet)"></i>
            <span class="pill-num" id="ds-mine">—</span>
            <span style="color:var(--text-muted)">Của tôi</span>
        </div>
    </div>

    <div class="queue-grid fade-in">

        <!-- ── Left sidebar: my assigned + filters ── -->
        <div class="dev-sidebar">

            <!-- Search -->
            <div class="search-wrap">
                <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input class="input" id="dev-search" type="text" placeholder="Tìm report…" oninput="debounceSearch()">
            </div>

            <!-- Filter by status -->
            <select class="input" id="dev-filter-status" onchange="loadQueue()">
                <option value="">Tất cả trạng thái</option>
                <option value="OPEN">Open</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="RESOLVED">Resolved</option>
                <option value="CLOSED">Closed</option>
                <option value="WONT_FIX">Won't Fix</option>
            </select>

            <!-- Filter by priority -->
            <select class="input" id="dev-filter-priority" onchange="loadQueue()">
                <option value="">Tất cả mức độ</option>
                <option value="CRITICAL">🔥 Critical</option>
                <option value="HIGH">↑ High</option>
                <option value="MEDIUM">— Medium</option>
                <option value="LOW">↓ Low</option>
            </select>

            <div class="sidebar-section-title" style="margin-top:4px">QUEUE</div>
            <div id="sidebar-list" style="display:flex;flex-direction:column;gap:8px">
                <div style="text-align:center;padding:20px;color:var(--text-dim)">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                </div>
            </div>

        </div>

        <!-- ── Right work area ── -->
        <div class="work-area">
            <div class="detail-panel" id="detail-panel">
                <div class="detail-empty" id="detail-empty">
                    <div class="empty-icon-large">🔍</div>
                    <div style="font-size:1rem;font-weight:600;color:var(--text-muted)">Chọn một report để bắt đầu</div>
                    <div style="font-size:0.83rem;color:var(--text-dim)">Hoặc nhận report chưa được giao từ queue</div>
                    <button class="btn btn-dev" style="margin-top:8px" onclick="loadUnassigned()">
                        <i class="fa-solid fa-inbox"></i> Xem báo cáo chưa giao
                    </button>
                </div>
                <div id="detail-content" style="display:none"></div>
            </div>
        </div>

    </div>

</div>

<!-- Image lightbox -->
<div id="img-lightbox" onclick="closeLightbox()">
    <button class="close-lb" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
    <img id="lightbox-img" src="" alt="Screenshot">
</div>

<!-- Toast -->
<div id="toast">
    <i class="fa-solid fa-circle-check" id="toast-icon"></i>
    <span id="toast-msg"></span>
</div>

<script src="js/developer.js"></script>
</body>
</html>
